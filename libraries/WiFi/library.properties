sentence=Wi-Fi station, network scan and TCP client for Bouffalo Lab BL boards, with the Arduino WiFi library API.
paragraph=Interface follows the official Arduino WiFi libraries (WiFiS3, WiFiNINA): WiFi.begin, status, address queries, scanNetworks, hostByName, ping and WiFiClient. Uses the wl80211 stack and lwIP from the bl616cl-libs package.
