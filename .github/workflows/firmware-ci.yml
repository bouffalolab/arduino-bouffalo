name: firmware-ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: bouffalolab/arduino-bouffalo-lib-builder/.github/workflows/firmware-ci.yml@master
    with:
      builder-ref: master
      platform-ref: ${{ github.sha }}
      skip-bridge: true
